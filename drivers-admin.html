<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT - Driver Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    .navbar { background-color: #7b2cbf !important; }
    .card { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white text-decoration-none d-flex align-items-center" href="#">
        <img src="logo.png" alt="UT Logo" style="height: 40px; margin-right: 12px; border-radius: 4px;">
        <div style="line-height: 1.2;">
          Universal Tractor Co., Ltd.<br>
          <small style="font-size: 0.75rem; font-weight: 400;">Driver Management Admin</small>
        </div>
      </a>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-car-front"></i> Registry</a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="portal.html" class="btn btn-outline-light btn-sm"><i class="bi bi-journal-check"></i> Portal</a>
        <a href="login.html" class="btn btn-light btn-sm fw-bold" style="color: #7b2cbf;"><i class="bi bi-box-arrow-in-right"></i> Login</a>
      </div>
    </div>
  </nav>

  <div class="container pb-5" style="max-width: 800px;">
    <!-- Driver အသစ်ထည့်ရန် Form -->
    <div class="card p-4 bg-white mb-4">
      <h4 class="fw-bold mb-3" style="color: #7b2cbf;"><i class="bi bi-person-plus"></i> Create Driver Account</h4>
      
      <form onsubmit="saveDriver(event)">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="fw-bold small">Driver Full Name</label>
            <input type="text" id="dName" class="form-control" placeholder="e.g. U Aung Aung" required>
          </div>
          <div class="col-md-4">
            <label class="fw-bold small">Username</label>
            <input type="text" id="dUser" class="form-control" placeholder="e.g. aungaung" required>
          </div>
          <div class="col-md-4">
            <label class="fw-bold small">Password</label>
            <input type="text" id="dPass" class="form-control" placeholder="e.g. secret123" required>
          </div>
          <div class="col-12 mt-3">
            <button type="submit" class="btn w-100 text-white fw-bold py-2" style="background-color: #7b2cbf;" id="btnSave">Save Driver Account</button>
          </div>
        </div>
      </form>
    </div>

    <!-- Drivers စာရင်းဇယား (ကြည့်ရှုခြင်း၊ ပြင်ဆင်ခြင်း၊ ဖျက်ခြင်း) -->
    <div class="card p-4 bg-white">
      <h4 class="fw-bold mb-3 text-secondary"><i class="bi bi-people"></i> Registered Drivers List</h4>
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle text-center">
          <thead class="table-dark">
            <tr>
              <th>Driver Name</th>
              <th>Username</th>
              <th>Password</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="driverTableBody">
            <tr><td colspan="4" class="text-muted py-3">Loading Drivers...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Driver အချက်အလက်ပြင်ဆင်ရန် Modal -->
  <div class="modal fade" id="editDriverModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header" style="background-color: #7b2cbf; color: white;">
          <h5 class="modal-title fw-bold">Edit Driver Account</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editDocId">
          <div class="mb-3">
            <label class="fw-bold small">Driver Full Name</label>
            <input type="text" id="editName" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="fw-bold small">Username</label>
            <input type="text" id="editUser" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="fw-bold small">Password</label>
            <input type="text" id="editPass" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn text-white btn-sm fw-bold" style="background-color: #7b2cbf;" onclick="updateDriver()">Update Account</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyCnQcsv8TekFkOyOPnb3UWZytPq7zBxLfI",
  authDomain: "my-apps-a87a3.firebaseapp.com",
  projectId: "my-apps-a87a3",
  storageBucket: "my-apps-a87a3.firebasestorage.app",
  messagingSenderId: "880270085984",
  appId: "1:880270085984:web:94d1895bd28335abaf1805"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let editModal = null;

    window.onload = () => {
      editModal = new bootstrap.Modal(document.getElementById('editDriverModal'));
      fetchDrivers();
    };

    async function saveDriver(e) {
      e.preventDefault();
      let name = document.getElementById('dName').value.trim();
      let username = document.getElementById('dUser').value.trim();
      let password = document.getElementById('dPass').value.trim();
      let btn = document.getElementById('btnSave');
      
      btn.disabled = true; btn.innerText = "Saving & Syncing...";

      try {
        await db.collection('vms_drivers').add({
          name: name, username: username, password: password,
          created_at: new Date().toISOString()
        });

        await db.collection('vms_settings').add({
          category: 'Driver', subcategory: name,
          created_at: new Date().toISOString()
        });

        Swal.fire("Success", "Driver created and synced successfully!", "success");
        document.getElementById('dName').value = '';
        document.getElementById('dUser').value = '';
        document.getElementById('dPass').value = '';
        fetchDrivers();
      } catch (err) {
        Swal.fire("Error", err.message, "error");
      } finally {
        btn.disabled = false; btn.innerText = "Save Driver Account";
      }
    }

    async function fetchDrivers() {
      try {
        const snap = await db.collection('vms_drivers').get();
        let tbody = '';
        if (snap.empty) {
          tbody = '<tr><td colspan="4" class="text-muted py-3">No drivers found.</td></tr>';
        } else {
          snap.docs.forEach(doc => {
            let d = doc.data();
            let id = doc.id;
            tbody += `<tr>
              <td class="fw-bold">${d.name}</td>
              <td>${d.username}</td>
              <td><code>${d.password}</code></td>
              <td>
                <button class="btn btn-warning btn-sm me-1" onclick="openEdit('${id}', '${d.name}', '${d.username}', '${d.password}')"><i class="bi bi-pencil"></i></button>
                <button class="btn btn-danger btn-sm" onclick="deleteDriver('${id}', '${d.name}')"><i class="bi bi-trash"></i></button>
              </td>
            </tr>`;
          });
        }
        document.getElementById('driverTableBody').innerHTML = tbody;
      } catch (err) {
        document.getElementById('driverTableBody').innerHTML = `<tr><td colspan="4" class="text-danger py-3">Error loading drivers</td></tr>`;
      }
    }

    function openEdit(id, name, user, pass) {
      document.getElementById('editDocId').value = id;
      document.getElementById('editName').value = name;
      document.getElementById('editUser').value = user;
      document.getElementById('editPass').value = pass;
      editModal.show();
    }

    async function updateDriver() {
      let id = document.getElementById('editDocId').value;
      let name = document.getElementById('editName').value.trim();
      let username = document.getElementById('editUser').value.trim();
      let password = document.getElementById('editPass').value.trim();

      if (!name || !username || !password) return Swal.fire("Warning", "All fields are required", "warning");

      try {
        await db.collection('vms_drivers').doc(id).update({ name, username, password });
        editModal.hide();
        Swal.fire("Updated", "Driver account updated successfully", "success");
        fetchDrivers();
      } catch (err) {
        Swal.fire("Error", err.message, "error");
      }
    }

    async function deleteDriver(id, name) {
      let confirm = await Swal.fire({
        title: `Delete ${name}?`,
        text: "This will remove their login access.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Yes, delete it!'
      });

      if (confirm.isConfirmed) {
        try {
          await db.collection('vms_drivers').doc(id).delete();
          Swal.fire("Deleted!", "Driver account has been deleted.", "success");
          fetchDrivers();
        } catch (err) {
          Swal.fire("Error", err.message, "error");
        }
      }
    }
  </script>
</body>
</html>
