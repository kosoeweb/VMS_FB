<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT - Driver Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; }
    .navbar { background-color: #7b2cbf !important; }
    .card { border: none; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark mb-4 shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold text-white">Universal Tractor Co., Ltd. - Driver Accounts</span>
      <div>
        <a href="index.html" class="btn btn-outline-light btn-sm">Vehicle Registry</a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="container" style="max-width: 600px;">
    <div class="card p-4 bg-white">
      <h4 class="fw-bold mb-3" style="color: #7b2cbf;">Create Driver Account</h4>
      
      <form onsubmit="saveDriver(event)">
        <div class="mb-3">
          <label class="fw-bold small">Driver Full Name</label>
          <input type="text" id="dName" class="form-control" placeholder="e.g. U Aung Aung" required>
        </div>
        <div class="mb-3">
          <label class="fw-bold small">Username</label>
          <input type="text" id="dUser" class="form-control" placeholder="e.g. aungaung" required>
        </div>
        <div class="mb-4">
          <label class="fw-bold small">Password</label>
          <input type="text" id="dPass" class="form-control" placeholder="e.g. secret123" required>
        </div>
        <button type="submit" class="btn w-100 text-white fw-bold" style="background-color: #7b2cbf;" id="btnSave">Save Driver Account</button>
      </form>
    </div>
  </div>

  <script>
    // သင့် Firebase Project ၏ Config အချက်အလက်များကို ထည့်သွင်းပါ
    const firebaseConfig = {
  apiKey: "AIzaSyCnQcsv8TekFkOyOPnb3UWZytPq7zBxLfI",
  authDomain: "my-apps-a87a3.firebaseapp.com",
  projectId: "my-apps-a87a3",
  storageBucket: "my-apps-a87a3.firebasestorage.app",
  messagingSenderId: "880270085984",
  appId: "1:880270085984:web:94d1895bd28335abaf1805"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function saveDriver(e) {
      e.preventDefault();
      let name = document.getElementById('dName').value.trim();
      let username = document.getElementById('dUser').value.trim();
      let password = document.getElementById('dPass').value.trim();
      let btn = document.getElementById('btnSave');
      
      btn.disabled = true;
      btn.innerText = "Saving...";

      try {
        await db.collection('vms_drivers').add({
          name: name,
          username: username,
          password: password,
          created_at: new Date().toISOString()
        });

        Swal.fire("Success", "Driver account created successfully!", "success");
        document.getElementById('dName').value = '';
        document.getElementById('dUser').value = '';
        document.getElementById('dPass').value = '';
      } catch (err) {
        Swal.fire("Error", err.message, "error");
      } finally {
        btn.disabled = false;
        btn.innerText = "Save Driver Account";
      }
    }
  </script>
</body>
</html>
