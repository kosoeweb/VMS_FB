<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT - Driver Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #f4f6f9; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    .navbar { background-color: #7b2cbf !important; }
    .login-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { width: 100%; max-width: 400px; border: none; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-white text-decoration-none d-flex align-items-center" href="#">
        <img src="logo.png" alt="UT Logo" style="height: 40px; margin-right: 12px; border-radius: 4px;">
        <div style="line-height: 1.2;">
          Universal Tractor Co., Ltd.<br>
          <small style="font-size: 0.75rem; font-weight: 400;">Driver Log Portal</small>
        </div>
      </a>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-car-front"></i> Registry</a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="drivers-admin.html" class="btn btn-outline-light btn-sm"><i class="bi bi-person-gear"></i> Drivers Admin</a>
      </div>
    </div>
  </nav>

  <div class="login-container">
    <div class="card login-card p-4 bg-white">
      <div class="text-center mb-4">
        <img src="https://zdifzvpjmmmsfitjsraw.supabase.co/storage/v1/object/public/Logo/UT%20Logo.png" alt="UT Logo" style="height: 60px; margin-bottom: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.15);">
        <h4 class="fw-bold" style="color: #7b2cbf;">Driver Sign In</h4>
        <p class="text-muted small">Enter your credentials to access vehicle log portal</p>
      </div>
      
      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="fw-bold small">Username</label>
          <input type="text" id="loginUser" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="mb-4">
          <label class="fw-bold small">Password</label>
          <input type="password" id="loginPass" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn w-100 text-white fw-bold py-2" style="background-color: #7b2cbf;" id="btnLogin">Log In</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyCnQcsv8TekFkOyOPnb3UWZytPq7zBxLfI",
  authDomain: "my-apps-a87a3.firebaseapp.com",
  projectId: "my-apps-a87a3",
  storageBucket: "my-apps-a87a3.firebasestorage.app",
  messagingSenderId: "880270085984",
  appId: "1:880270085984:web:94d1895bd28335abaf1805"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function handleLogin(e) {
      e.preventDefault();
      let u = document.getElementById('loginUser').value.trim();
      let p = document.getElementById('loginPass').value.trim();
      let btn = document.getElementById('btnLogin');
      btn.disabled = true; btn.innerText = "Checking...";

      try {
        const snap = await db.collection('vms_drivers').where('username', '==', u).where('password', '==', p).get();
        if (snap.empty) {
          Swal.fire("Login Failed", "Incorrect username or password.", "error");
          btn.disabled = false; btn.innerText = "Log In";
        } else {
          let driverData = snap.docs[0].data();
          localStorage.setItem('ut_logged_driver', driverData.name);
          window.location.href = "portal.html";
        }
      } catch (err) {
        Swal.fire("Error", err.message, "error");
        btn.disabled = false; btn.innerText = "Log In";
      }
    }
  </script>
</body>
</html>
